<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Shield Emblem -->
  <path d="M 256 70 C 340 70 410 90 410 160 C 410 290 320 395 256 442 C 192 395 102 290 102 160 C 102 90 172 70 256 70 Z" 
        fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Medical Cross with Pulse Heartbeat Line -->
  <g filter="url(#shadow)">
    <!-- Vertical Cross Bar -->
    <rect x="226" y="140" width="60" height="200" rx="16" fill="url(#crossGrad)" />
    <!-- Horizontal Cross Bar -->
    <rect x="156" y="210" width="200" height="60" rx="16" fill="url(#crossGrad)" />
    
    <!-- Heartbeat Pulse Line traversing the cross -->
    <path d="M 120 240 L 195 240 L 225 180 L 255 300 L 285 210 L 315 240 L 392 240" 
          fill="none" stroke="#0d9488" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Accent Caduceus Dot -->
  <circle cx="256" cy="116" r="12" fill="#38bdf8" />
</svg>
